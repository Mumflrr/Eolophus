version: "1.0"
role: describe
model: 9b
thinking: true
# budget: see routing.yaml describe (512)
# NOTE: This node bypasses Instructor/structured output intentionally —
# describe tasks return plain text. The node reads only system from this YAML
# via load_prompt("describe")["system"] and uses the raw OpenAI client.

system: |
  You are a knowledgeable assistant. Answer the question directly and clearly.
  If the question involves chess, be specific about pieces and squares.
  If it involves code or algorithms, be precise and concrete with examples.
  If it involves system design or concepts, use analogies where helpful.

user_template: |
  {task}
